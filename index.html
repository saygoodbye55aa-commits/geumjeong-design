<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>금정디자인 | 부산·경남 인테리어</title>
<style>
:root{--gold:#b48742;--dark:#111;--cream:#f7f3ec;--line:#e9e5df}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#eee;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;color:#171717}
a{text-decoration:none;color:inherit}.page{max-width:520px;margin:auto;background:#fff;min-height:100vh;padding-bottom:82px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #eee;padding:13px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;font-size:24px;letter-spacing:-1.5px}.logo span{color:var(--gold)}
.head-sub{font-size:10px;color:#777;margin-top:2px}.menu{font-size:27px;cursor:pointer}
.hero{padding:36px 22px 32px;background:linear-gradient(145deg,#f8f5ef,#fff)}
.badge{display:inline-block;background:#171717;color:#fff;padding:8px 13px;border-radius:99px;font-size:12px;font-weight:700}
.hero h1{font-size:39px;line-height:1.08;letter-spacing:-2px;margin:18px 0 10px}.hero h1 span{color:var(--gold)}
.hero p{font-size:16px;line-height:1.65;color:#555;margin:0}.cta{display:flex;gap:9px;margin-top:22px}
.btn{flex:1;padding:14px 8px;border-radius:12px;text-align:center;font-weight:800;font-size:14px}.btn.dark{background:#171717;color:#fff}.btn.gold{background:var(--gold);color:#fff}
section{padding:30px 18px}.eyebrow{font-size:12px;color:var(--gold);font-weight:900;letter-spacing:1px}
h2{font-size:25px;letter-spacing:-1.2px;margin:6px 0 17px}
.services{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.service{border:1px solid var(--line);border-radius:17px;padding:19px 15px}.service:last-child{grid-column:span 2}
.ico{font-size:25px}.service b{display:block;font-size:17px;margin-top:8px}.service small{display:block;color:#777;margin-top:5px;font-size:12px}
.portfolio{background:var(--cream)}.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-card{margin:0;background:#fff;border-radius:15px;overflow:hidden;border:1px solid #e5dfd5}
.photo-card img{display:block;width:100%;height:150px;object-fit:cover}.photo-card figcaption{padding:9px 11px;font-size:12px;font-weight:800;color:#555}
.trust{display:grid;grid-template-columns:1fr 1fr;gap:10px}.trust div{background:#fafafa;border-radius:15px;padding:18px 13px;text-align:center}
.trust b{display:block;margin-top:7px}.trust small{color:#777}
.contact{margin:0 18px 25px;border-radius:22px;background:#171717;color:#fff;padding:25px 20px}
.contact .num{font-size:29px;font-weight:900;margin:9px 0}.contact p{color:#ccc;font-size:13px;margin:5px 0}
.contact a{display:block;background:var(--gold);padding:14px;border-radius:12px;text-align:center;font-weight:900;margin-top:16px}
footer{text-align:center;color:#999;font-size:11px;padding:5px 20px 20px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:70px;background:#fff;border-top:1px solid #ddd;display:flex;z-index:30}
.bottom a{flex:1;text-align:center;padding-top:11px;font-size:11px;font-weight:800}.bottom b{display:block;font-size:21px}.bottom .call{background:#171717;color:#fff}

/* 상단 ☰ 메뉴 */
.side-menu{display:none;position:fixed;inset:0;z-index:100;background:#0008}
.side-menu.open{display:block}
.side-inner{position:absolute;right:0;top:0;height:100%;width:min(390px,88%);background:#fff;padding:70px 20px 30px;overflow:auto;box-shadow:-8px 0 30px #0003}
.close-menu{position:absolute;right:18px;top:18px;border:0;background:none;font-size:38px;line-height:1}
.menu-logo{font-weight:900;font-size:32px;letter-spacing:-2px}.menu-logo span{color:var(--gold)}
.menu-sub{font-size:13px;color:#777;margin:7px 0 22px;border-bottom:1px solid #eee;padding-bottom:20px}
.menu-info{display:flex;align-items:center;gap:14px;padding:16px;margin:10px 0;border-radius:16px}
.menu-info .mi{font-size:27px}.menu-info b{display:block;font-size:18px}.menu-info small{display:block;color:#666;margin-top:5px;font-size:13px}
.menu-info.address{background:#fff3f0}.menu-info.map{background:#f0faf1}.menu-info.phone{background:#eef7ff}
.menu-links{border-top:1px solid #eee;border-bottom:1px solid #eee;margin-top:18px;padding:8px 0}
.menu

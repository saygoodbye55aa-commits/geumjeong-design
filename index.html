<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>금정디자인</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eee9e1;color:#2d261f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif}
.page{width:min(100%,520px);margin:auto;background:#faf8f3;min-height:100vh;box-shadow:0 0 30px #00000012}
header{height:78px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #eee6dc;position:sticky;top:0;z-index:20}
.logo-wrap{display:flex;align-items:center;gap:10px}.logo-mark{width:35px;height:35px;border:1.5px solid #a0783d;transform:rotate(45deg);display:grid;place-items:center;color:#a0783d}.logo-mark span{transform:rotate(-45deg);font-size:13px}.logo-title{font-family:Georgia,"Times New Roman",serif;color:#8d6735;font-size:28px;letter-spacing:-1px}.logo-sub{font-size:9px;color:#7b756e;letter-spacing:1.4px;margin-top:2px}
.menu{border:0;background:none;font-size:31px;color:#332b23;line-height:1}
.hero{position:relative;height:390px;overflow:hidden;background:#f5f1ea}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(250,248,243,.98) 0%,rgba(250,248,243,.88) 42%,rgba(250,248,243,.18) 76%,rgba(250,248,243,0) 100%)}
.hero-copy{position:relative;z-index:1;padding:52px 25px;width:61%}.eyebrow{font-size:10px;letter-spacing:5px;color:#a0783d}h1{font-family:Georgia,"Times New Roman",serif;font-size:42px;line-height:1.15;margin:18px 0 16px;letter-spacing:-2px;color:#39291d}.hero-copy .line{width:58px;height:3px;background:#9d7640;margin-bottom:18px}.hero-copy p{font-size:13px;line-height:1.7;color:#706961;margin:0}.actions{display:flex;gap:8px;margin-top:18px}.btn{text-decoration:none;padding:11px 13px;border-radius:20px;font-size:11px;font-weight:800}.primary{background:#a0783d;color:#fff}.secondary{background:#fff;color:#76562d;border:1px solid #eadfce}
.service{padding:24px 14px 34px}.section-kicker{font-size:10px;letter-spacing:5px;color:#a0783d}.service h2{font-family:Georgia,"Times New Roman",serif;font-size:34px;margin:9px 0 8px;letter-spacing:-1.5px}.service-rule{width:56px;height:3px;background:#9d7640;margin-bottom:16px}.service-intro{font-size:13px;color:#777069;line-height:1.65;margin:0 0 20px}.service-intro strong{color:#43382e}
.service-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.service-card{background:#fff;border:1px solid #e8e1d7;border-radius:18px;overflow:hidden;box-shadow:0 5px 15px rgba(77,57,33,.06)}.service-card>img{width:100%;height:132px;display:block;object-fit:cover}.service-body{position:relative;padding:12px 12px 14px;min-height:94px}.service-body b{font-size:19px}.service-body p{margin:4px 0;color:#77716a;font-size:10px;line-height:1.55}.arrow{position:absolute;right:11px;bottom:11px;width:36px;height:36px;border-radius:50%;background:#f1e2ca;color:#775528;display:grid;place-items:center;font-size:24px}
.wide{grid-column:1/-1;position:relative;height:150px;margin-top:0;border:1px solid #e8e1d7;border-radius:18px;overflow:hidden;background:#fff}.wide>img{width:100%;height:100%;display:block;object-fit:cover}.wide:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.88) 38%,rgba(255,255,255,.16) 68%,rgba(255,255,255,0) 100%)}.wide-copy{position:absolute;z-index:2;inset:0;padding:34px 18px;width:63%}.wide-copy b{font-size:21px}.wide-copy p{margin:5px 0;color:#77716a;font-size:10px;line-height:1.6}
.proof{background:#9d7640;color:#fff;padding:22px 12px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.proof b{display:block;font-size:13px;margin-bottom:4px}.proof span{font-size:9px;opacity:.88}
.case,.about,.review,.contact,.map{padding:30px 14px}.case{background:#f7f3ec}.section-title{font-size:25px;margin:0 0 15px;letter-spacing:-1px}.casebox{background:#fff;border-radius:16px;padding:12px;border:1px solid #e7dfd4}.case-title{font-weight:900;margin:2px 2px 11px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compare img{width:100%;height:170px;object-fit:cover;border-radius:11px;display:block}.label{font-size:10px;font-weight:800;margin:6px 2px 0;color:#6d655d}
.about{display:grid;gap:15px}.about img{width:100%;height:205px;object-fit:cover;border-radius:15px}.about p{font-size:13px;line-height:1.8;color:#6e6861;margin:0}
.quote{border:1px solid #e5ddd2;border-radius:15px;padding:18px;background:#fff;font-size:14px;line-height:1.8}
.contact{background:#f7f3ec}.contact-box{background:#9d7640;color:#fff;border-radius:18px;padding:22px}.contact-box h2{margin:0 0 7px;font-size:25px}.contact-box p{margin:0 0 16px;font-size:12px;line-height:1.7}.contact-btns{display:flex;gap:8px}.contact-btns a{flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:12px;background:#fff;color:#775528;font-weight:800;font-size:12px}
.map-box{background:#eee5d8;border-radius:16px;padding:18px;color:#5d554d;line-height:1.7;font-size:12px}.map-box a{display:inline-block;margin-top:8px;color:#775528;font-weight:800}
footer{background:#2f281f;color:#dcd3c8;padding:24px 18px 90px;font-size:11px;line-height:1.8}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);height:68px;background:#fff;border-top:1px solid #e8e0d5;display:grid;grid-template-columns:repeat(4,1fr);z-index:30}.bottom a{text-decoration:none;color:#716a63;display:grid;place-items:center;align-content:center;font-size:10px;gap:3px}.bottom a b{font-size:18px;font-weight:500}.bottom a.active{background:#f0e3cf;color:#775528}
@media(max-width:390px){.hero{height:350px}.hero-copy{padding:42px 20px}h1{font-size:36px}.service-card>img{height:115px}.wide{height:135px}}
</style>
</head>
